[project]
name = "gateway"
version = "0.1.0"
description = "NexusMCP Gateway — MCP aggregation, auth, audit, and AI chat"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.0,<3",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "structlog>=24.0",
    # LLM providers
    "google-genai>=1.0",   # Gemini (new SDK — NOT google-generativeai which is EOL)
    "openai>=1.30",        # Used for Ollama OpenAI-compatible endpoint
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
