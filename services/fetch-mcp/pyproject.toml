[project]
name = "fetch-mcp"
version = "0.1.0"
description = "Fetch MCP Server — controlled HTTP fetch tool with SSRF guard"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetch_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
