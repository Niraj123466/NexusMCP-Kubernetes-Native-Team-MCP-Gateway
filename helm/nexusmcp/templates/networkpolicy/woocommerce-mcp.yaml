{{- if and .Values.networkPolicies.enabled .Values.woocommerceMcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woocommerce-mcp-netpol
  namespace: {{ .Values.namespace }}
  labels:
    app: woocommerce-mcp
    component: security
spec:
  podSelector:
    matchLabels:
      app: woocommerce-mcp
  policyTypes:
    - Ingress
  ingress:
    # Allow only the Gateway to communicate with the WooCommerce MCP server
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.woocommerceMcp.port }}
{{- end }}
