apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusmcp-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: nexusmcp
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    {{- if .Values.wordpress.enabled }}
    - host: {{ .Values.wordpress.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-svc
                port:
                  number: 80
    {{- end }}
    {{- if .Values.gateway.enabled }}
    - host: {{ .Values.gateway.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: {{ .Values.gateway.port }}
    {{- end }}
    {{- if .Values.frontend.enabled }}
    - host: {{ .Values.frontend.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: {{ .Values.frontend.port }}
    {{- end }}
