{{- if .Values.woocommerceMcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: woocommerce-mcp
    component: mcp-upstream
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.woocommerceMcp.port }}
      targetPort: {{ .Values.woocommerceMcp.port }}
      name: mcp
  selector:
    app: woocommerce-mcp
{{- end }}
