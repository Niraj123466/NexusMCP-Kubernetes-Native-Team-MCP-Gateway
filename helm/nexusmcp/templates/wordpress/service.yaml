{{- if .Values.wordpress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: wordpress
    component: store
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: wordpress
{{- end }}
