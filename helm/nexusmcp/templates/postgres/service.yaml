{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless for StatefulSet DNS
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
{{- end }}
