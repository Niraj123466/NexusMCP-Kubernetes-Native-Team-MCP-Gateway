{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mariadb-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: mariadb
    component: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mariadb
{{- end }}
