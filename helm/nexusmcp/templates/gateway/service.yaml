{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
    component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
      name: http
  selector:
    app: gateway
{{- end }}
