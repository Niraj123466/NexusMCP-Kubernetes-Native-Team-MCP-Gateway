# kind: Cluster
# Configures a single-node Kind cluster with NGINX Ingress port mappings.
# Port 80 and 443 on the host are forwarded into the cluster.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: nexusmcp

nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP — mapped so NGINX Ingress can receive traffic on localhost:80
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS — mapped for TLS termination (production-parity testing)
      - containerPort: 443
        hostPort: 443
        protocol: TCP
