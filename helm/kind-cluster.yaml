# kind: Cluster
# Configures a single-node Kind cluster with NGINX Ingress port mappings.
# Port 80 and 443 on the host are forwarded into the cluster.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: nexusmcp

nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP — host port 9080 (80 and 8080 are occupied by local nginx)
      - containerPort: 80
        hostPort: 9080
        protocol: TCP
      # HTTPS — host port 9443
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
